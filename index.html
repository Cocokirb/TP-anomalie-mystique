<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlitchZero</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h1>Gestionnaire de bugs</h1>
        <div class="nombreBugs" id="nombreBugs"></div>

    </header>

    <main>
        <form action="">
            <div class="formChamp">
                <label for="title">Titre</label>
                <input type="text" id = "title" name="title">
            </div>

            <div class="formChamp">
                <label for="autor">Auteur</label>
                <input type="text" id = "auteur" name="auteur">
            </div>

            <div class="formChamp">
                <label for="title">Sévérité</label>
                <select name="sévérité" id="sévérité">
                    <option value="">Choisir une sévérité</option>
                    <option value="">Basse</option>
                    <option value="">Moyenne</option>
                    <option value="">Critique</option>
                </select>
            </div>

            <div class="formChamp">
                <label for="reward">Récompense</label>
                <input type="number" id = "reward" name="reward">
            </div>

            <div class="formChamp">
                <label for="description">Description</label>
                <input type="number" id = "description" name="description">
            </div>

            <button type="submit">Ajouter le bugs</button>

        </form>

        <div class="listBug" id = "bug-grid">

        </div>
    </main>

    <script src="app.js"></script>

</body>
</html>
