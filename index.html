<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GlitchZero</title>
    <link rel="stylesheet" href="style.css">

</head>

<body>
    <header>
        <h1>Gestionnaire de bugs</h1>
        <div class="nombreBugs" id="nombreBugs"></div>

    </header>

    <main>
        <form id = "bugsForm" novalidate>
            <h2>Ajouter un bug</h2>
            <div class="formChamp">
                <label for="title">Titre</label>
                <input type="text" id = "title" name="title">
                <p class="error" id="error-title"></p>
            </div>

            <div class="formChamp">
                <label for="autor">Auteur</label>
                <input type="text" id = "autor" name="auteur">
                <p class="error" id="error-autor"></p>
            </div>

            <div class="formChamp">
                <label for="title">Sévérité</label>
                <select name="sévérité" id="severite">
                    <option value="">Choisir une sévérité</option>
                    <option value="Basse">Basse</option>
                    <option value="Moyenne">Moyenne</option>
                    <option value="Critique">Critique</option>
                </select>
                <p class="error" id="error-severite"></p>
            </div>

            <div class="formChamp">
                <label for="recompense">Récompense</label>
                <input type="number" id = "recompense" name="recompense">
                <p class="error" id="error-recompense"></p>
            </div>

            <div class="formChamp">
                <label for="description">Description</label>
                <input type="text" id = "description" name="description">
                <p class="error" id="error-description"></p>
            </div>

            <button type="submit">Ajouter le bug</button>

        </form>

        <div class="listBug" id = "bug-grid">

        </div>
    </main>

    <script src="app.js"></script>

</body>
</html>
